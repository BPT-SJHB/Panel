<!-- فرم ایجاد تیکت -->

<div class="flex justify-center items-center">
  <div class="flex flex-col justify-center items-center w-full lg:w-[80%] m-5">
    <div class="w-full flex flex-col lg:flex-row gap-4 mb-4">
      <!-- نوع تیکت -->
      <app-select-input
        [addonWidth]="addonWidth"
        [control]="ctrl('ticketTypeId')"
        [options]="ticketTypes()"
        label="نوع تیکت"
        placeholder="نوع تیکت را انتخاب کنید"
        class="w-full"
      ></app-select-input>

      <!-- دپارتمان -->
      <app-select-input
        [addonWidth]="addonWidth"
        [control]="ctrl('departmentId')"
        [options]="departments()"
        label="دپارتمان"
        placeholder="دپارتمان را انتخاب کنید"
        validationField="departmentId"
        class="w-full"
      ></app-select-input>
    </div>

    <!-- عنوان تیکت -->
    <app-text-input
      [addonWidth]="addonWidth"
      [control]="ctrl('title')"
      label="عنوان تیکت"
      placeholder="عنوان تیکت را وارد کنید"
      validationField="title"
      class="w-full mb-5"
    ></app-text-input>

    <!-- توضیحات تیکت -->
    <textarea
      [formControl]="ctrl('description')"
      placeholder="توضیحات تیکت را وارد کنید"
      class="w-full p-5 border-2 rounded-2xl h-60 placeholder:text-gray-400 resize-y"
    ></textarea>

    <div
      class="flex flex-col w-full gap-3 mt-4 px-3 py-3 rounded-2xl border bg-surface-50 border-surface-200 dark:bg-surface-800 dark:border-surface-700 transition-colors duration-300"
    >
      <div class="flex items-center justify-between w-full">
        <h2 class="text-base font-semibold text-gray-700 dark:text-gray-100">
          فایل‌های ضمیمه
        </h2>
        <span class="text-xs text-gray-500 dark:text-gray-400">
          حداکثر ۳ فایل
        </span>
      </div>

      <app-ticket-files-upload [control]="ctrl('attachment')" class="mt-0" />
    </div>

    <!-- دکمه ارسال -->
    <div class="w-full mt-4 flex flex-row left-1 px-3">
      <app-button
        styleClass="w-full sm:w-48 md:w-40"
        (onClick)="createTicket()"
        [disabled]="ticketForm.invalid || loading()"
      >
        ارسال تیکت
      </app-button>
    </div>
  </div>
</div>

<p-dialog
  header="تیکت شما با موفقیت ایجاد شد"
  [modal]="true"
  [visible]="ticketDialogVisible()"
  (visibleChange)="ticketDialogVisible.set($event)"
  [style]="{ width: '25rem' }"
>
  <div class="flex flex-col gap-4 p-4">
    <!-- Track code title -->
    <span class="text-lg font-semibold">شماره پیگیری تیکت شما</span>

    <!-- Small note -->
    <span class="text-sm text-gray-500">
      لطفاً این شماره را یادداشت کنید یا به خاطر بسپارید تا بتوانید تیکت خود را
      پیگیری کنید.
    </span>

    <!-- Track code display -->
    <div
      class="flex items-center justify-between p-3 rounded-lg shadow bg-emphasis cursor-pointer hover:bg-primary-emphasis"
      (click)="copyToClipboard()"
    >
      <span class="text-lg font-medium">{{ createdTrackCodeTicket() }}</span>
      <button type="button" title="کپی کد راهگیری">
        <i class="pi pi-copy text-xl"></i>
      </button>
    </div>

    <!-- Action buttons -->
    <div class="flex justify-between mt-4">
      <app-button
        severity="warn"
        styleClass="w-30"
        (onClick)="ticketDialogVisible.set(false)"
      >
        بازگشت
      </app-button>

      <app-button
        severity="primary"
        styleClass="w-30"
        (onClick)="trackTicket()"
      >
        پیگیری تیکت
      </app-button>
    </div>
  </div>
</p-dialog>

<app-ticket-guard-captcha-form
  [activeCaptcha]="activeCaptcha()"
  (hiddenDialog)="activeCaptcha.set(false)"
  [action]="createTicket"
/>
