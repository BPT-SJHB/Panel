<p-dialog
  draggable="false"
  header="تأیید امنیتی"
  [modal]="true"
  [visible]="captchaDialogVisible()"
  [style]="{ width: '30rem' }"
  (visibleChange)="captchaDialogVisible.set($event)"
  (onHide)="onDialogHidden()"
>
  <div class="flex flex-col gap-4">
    <!-- explanatory text -->
    <p class="text-gray-600 dark:text-gray-400">
      برای ادامه فرایند، لطفاً کد امنیتی زیر را وارد کنید.
    </p>

    <!-- captcha input -->
    @if (captchaDialogVisible()) {
      <app-text-input
        label="شماره موبایل"
        placeholder="شماره موبایل خود را وارد کنید."
        validationField="mobile"
        [control]="phoneNumber"
        type="number"
      />

      <app-captcha-input
        captchaServiceType="ticket"
        [sessionIdControl]="captchaId"
        [captchaInputControl]="captchaAnswer"
      ></app-captcha-input>
    }
  </div>

  <!-- buttons -->
  <div class="flex justify-end gap-2 mt-4">
    <app-button
      type="button"
      label="لغو"
      severity="info"
      styleClass="w-20"
      (click)="captchaDialogVisible.set(false)"
    ></app-button>
    <app-button
      type="button"
      label="تأیید"
      icon="pi pi-check"
      (click)="verifyCaptchaAndSendOTP()"
      styleClass="w-30"
      [disabled]="
        phoneNumber.invalid || captchaId.invalid || captchaAnswer.invalid
      "
    ></app-button>
  </div>
</p-dialog>

<!-- OTP Dialog -->
<p-dialog
  header="تایید کد یک‌بار مصرف"
  [modal]="true"
  [draggable]="false"
  [visible]="otpDialogVisible()"
  (visibleChange)="otpDialogVisible.set($event)"
  (onHide)="resetOTPForm()"
  [style]="{ width: '30rem', maxWidth: '100%' }"
>
  <div class="flex flex-col gap-4">
    <p class="text-sm">
      کاربر گرامی، رمز یک‌بار مصرف به شماره
      <strong class="text-base">{{ otpPhoneNumber() }}</strong>
      ارسال شد. لطفا جهت ثبت تیکت کد یک‌بار مصرف پیامک شده را وارد کنید.
    </p>

    <div class="grid grid-cols-1 gap-4">
      <app-opt-input [control]="otpCode" [length]="6" />

      <div class="flex justify-center items-center py-1">
        <app-button
          (click)="verifyOTPCode()"
          styleClass="px-10"
          [disabled]="otpCode.invalid || loading()"
        >
          تایید
        </app-button>
      </div>
    </div>
  </div>
</p-dialog>
